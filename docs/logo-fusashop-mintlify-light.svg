<svg width="170" height="32" viewBox="0 0 170 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fusaGrad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00843D"/>
    </linearGradient>
    <filter id="fusaShadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Isotipo: Orquídea del Sumapaz + Carrito Digital -->
  <g filter="url(#fusaShadow-light)">
    <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#fusaGrad-light)"/>
  </g>

  <!-- Icono Interior (Blanco con transparencias de pétalos) -->
  <g transform="translate(4.5, 4.5) scale(0.96)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12 2a4 4 0 0 1 4 4c0 3-4 6-4 6s-4-3-4-6a4 4 0 0 1 4-4z" fill="rgba(255,255,255,0.35)"/>
    <path d="M7 10a3 3 0 0 1 3-3c2 0 3 3 3 3s-3 2-4 3a3 3 0 0 1-2-3z" fill="rgba(255,255,255,0.25)"/>
    <path d="M17 10a3 3 0 0 0-3-3c-2 0-3 3-3 3s3 2 4 3a3 3 0 0 0 2-3z" fill="rgba(255,255,255,0.25)"/>
    <circle cx="9" cy="20" r="1.5" fill="#FFFFFF"/>
    <circle cx="17" cy="20" r="1.5" fill="#FFFFFF"/>
    <path d="M4 5h2l2 9h10l2-6H7"/>
  </g>

  <!-- Tipografía FusaShop con los colores del e-commerce -->
  <text x="40" y="23" font-family="'Plus Jakarta Sans', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#10B981">Fus</tspan><tspan fill="#2563EB">a</tspan><tspan fill="#F97316">Shop</tspan>
  </text>
</svg>