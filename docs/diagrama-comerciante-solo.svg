    </g>
  
    <g class="use-case">
      <ellipse cx="400" cy="325" rx="115" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
      <text x="400" y="331" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="middle">Atender pedidos</text>
