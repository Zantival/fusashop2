<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <rect width="820" height="580" fill="#FFFFFF" />
  <rect x="230" y="40" width="340" height="500" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />
  <text x="242" y="68" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">FusaShop (Comerciante)</text>
  <line x1="147" y1="235" x2="285" y2="125" stroke="#000000" stroke-width="3" stroke-linecap="round" />
<line x1="147" y1="250" x2="285" y2="225" stroke="#000000" stroke-width="3" stroke-linecap="round" />
<line x1="147" y1="275" x2="285" y2="325" stroke="#000000" stroke-width="3" stroke-linecap="round" />
<line x1="147" y1="295" x2="285" y2="425" stroke="#000000" stroke-width="3" stroke-linecap="round" />

  
    <g class="use-case">
      <ellipse cx="400" cy="125" rx="115" ry="36" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
