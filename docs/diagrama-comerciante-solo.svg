      <line x1="115" y1="228" x2="115" y2="292" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      <!-- Brazos -->
      <line x1="83" y1="250" x2="147" y2="250" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      <!-- Pierna izquierda -->
      <line x1="115" y1="292" x2="87" y2="348" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      <!-- Pierna derecha -->
      <line x1="115" y1="292" x2="143" y2="348" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      <!-- Nombre del Actor -->
      <text x="115" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="middle">Comerciante</text>
