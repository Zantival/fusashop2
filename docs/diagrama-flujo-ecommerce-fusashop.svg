<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2220" width="1000" height="2220">
  <defs>
    <!-- Marcadores de Flecha Monocromáticos -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; }
    .subtitle-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    .phase-tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #000000; letter-spacing: 1.2px; text-transform: uppercase; }
    
    .node-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .node-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
    
    .decision-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .terminal-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .badge-txt { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #000000; }
    
    .flow-solid { fill: none; stroke: #000000; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow-dashed { fill: none; stroke: #475569; stroke-width: 1.8; stroke-dasharray: 5,4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Lienzo Blanco Técnico -->
  <rect width="1000" height="2220" fill="#FFFFFF" />

  <!-- Encabezado Sobrio y Línea Divisoria -->
  <rect x="40" y="30" width="920" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="60" y="60" class="title-text">DIAGRAMA DE FLUJO DEL E-COMMERCE: CICLO TRANSACCIONAL Y MULTIVENDEDOR</text>
  <text x="60" y="85" class="subtitle-text">Plataforma FusaShop · Especificación Técnica en Blanco y Negro para Tesis de Grado</text>

  <!-- ========================================================================= -->
  <!-- NODO 1: INICIO (Terminal)                                                 -->
  <!-- ========================================================================= -->
  <rect x="390" y="140" width="220" height="46" rx="23" ry="23" fill="#E2E8F0" stroke="#000000" stroke-width="2" />
  <text x="500" y="163" class="terminal-txt">Inicio: Cliente ingresa al sistema</text>

  <line x1="500" y1="186" x2="500" y2="230" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 2: CATÁLOGO Y DESCUBRIMIENTO                                         -->
  <!-- ========================================================================= -->
  <text x="60" y="260" class="phase-tag">Fase 1: Catálogo y Carrito</text>
  
  <rect x="370" y="230" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="253" class="node-title">Exploración de Catálogo</text>
  <text x="500" y="273" class="node-desc">Búsqueda reactiva en Omnibar o asistente FusaBot</text>

  <line x1="500" y1="294" x2="500" y2="335" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 3: CARRITO DE COMPRAS                                                -->
  <!-- ========================================================================= -->
  <rect x="370" y="335" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="358" class="node-title">Configuración de Carrito</text>
  <text x="500" y="378" class="node-desc">Agregado de referencias físicas o reserva turística</text>

  <line x1="500" y1="399" x2="500" y2="440" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 4: DECISIÓN AUTENTICACIÓN                                            -->
  <!-- ========================================================================= -->
  <polygon points="500,440 640,490 500,540 360,490" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="500" y="484" class="decision-txt">¿Usuario</text>
  <text x="500" y="501" class="decision-txt">Autenticado?</text>

  <!-- Rama No Autenticado -->
  <line x1="640" y1="490" x2="740" y2="490" class="flow-dashed" marker-end="url(#arrow-dash)" />
  <text x="670" y="480" class="badge-txt">NO</text>
  
  <rect x="740" y="460" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="840" y="483" class="node-title">Autenticación / Registro</text>
  <text x="840" y="501" class="node-desc">Google OAuth 2.0 o Email 2FA</text>

  <!-- Retorno de login hacia checkout -->
  <path d="M 840 520 L 840 590 L 630 590" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- Rama Sí Autenticado -->
  <line x1="500" y1="540" x2="500" y2="620" class="flow-solid" marker-end="url(#arrow-black)" />
  <text x="515" y="575" class="badge-txt">SÍ</text>

  <!-- ========================================================================= -->
  <!-- NODO 5: CHECKOUT Y COTIZACIÓN                                             -->
  <!-- ========================================================================= -->
  <text x="60" y="650" class="phase-tag">Fase 2: Cotización y Checkout</text>

  <rect x="360" y="620" width="280" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="643" class="node-title">Ingreso a Checkout</text>
  <text x="500" y="662" class="node-desc">Validación de dirección y flete por API Envia.com</text>
  <text x="500" y="676" class="node-desc">Aplicación de Cupones o Puntos FusaCoins</text>

  <line x1="500" y1="688" x2="500" y2="730" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 6: CREACIÓN DE ORDEN PENDIENTE Y FIRMA SHA-256                       -->
  <!-- ========================================================================= -->
  <rect x="360" y="730" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="753" class="node-title">Generación de Orden "PENDING"</text>
  <text x="500" y="773" class="node-desc">Asignación de referencia FS-... y firma SHA-256</text>

  <line x1="500" y1="796" x2="500" y2="840" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 7: PASARELA DE PAGO                                                  -->
  <!-- ========================================================================= -->
  <text x="60" y="870" class="phase-tag">Fase 3: Pasarela de Pago</text>

  <rect x="360" y="840" width="280" height="66" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="863" class="node-title">Cobro Centralizado Wompi / PayU</text>
  <text x="500" y="883" class="node-desc">Transacción vía PSE, Tarjeta, Nequi o Daviplata</text>

  <line x1="500" y1="906" x2="500" y2="950" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 8: RECEPCIÓN DE WEBHOOK ASÍNCRONO                                    -->
  <!-- ========================================================================= -->
  <rect x="350" y="950" width="300" height="66" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="973" class="node-title">Recepción de Webhook Asíncrono</text>
  <text x="500" y="993" class="node-desc">Validación de firma criptográfica e idempotencia</text>

  <line x1="500" y1="1016" x2="500" y2="1060" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 9: DECISIÓN PAGO APROBADO                                            -->
  <!-- ========================================================================= -->
  <polygon points="500,1060 650,1115 500,1170 350,1115" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="500" y="1108" class="decision-txt">¿Transacción</text>
  <text x="500" y="1126" class="decision-txt">APROBADA?</text>

  <!-- Rama Rechazada -->
  <line x1="650" y1="1115" x2="750" y2="1115" class="flow-dashed" marker-end="url(#arrow-dash)" />
  <text x="670" y="1105" class="badge-txt">NO</text>
  
  <rect x="750" y="1085" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="850" y="1108" class="node-title">Estado "DECLINED"</text>
  <text x="850" y="1126" class="node-desc">Notificar fallo y liberar reservas</text>

  <line x1="850" y1="1145" x2="850" y2="1195" class="flow-dashed" marker-end="url(#arrow-dash)" />
  <rect x="750" y="1195" width="200" height="42" rx="21" fill="#E2E8F0" stroke="#000000" stroke-width="1.8" />
  <text x="850" y="1216" class="terminal-txt" font-size="11px">Fin: Intento Fallido</text>

  <!-- Rama Aprobada -->
  <line x1="500" y1="1170" x2="500" y2="1250" class="flow-solid" marker-end="url(#arrow-black)" />
  <text x="515" y="1210" class="badge-txt">SÍ</text>

  <!-- ========================================================================= -->
  <!-- NODO 10: ACTUALIZACIÓN DE ORDEN Y BLOQUEO PESIMISTA                       -->
  <!-- ========================================================================= -->
  <text x="60" y="1280" class="phase-tag">Fase 4: Liquidación Contable</text>

  <rect x="350" y="1250" width="300" height="68" rx="8" fill="#F8FAFC" stroke="#000000" stroke-width="2" />
  <text x="500" y="1273" class="node-title">Orden Acreditada ("PAID")</text>
  <text x="500" y="1293" class="node-desc">Deducción de inventario con Bloqueo Pesimista (FOR UPDATE)</text>

  <line x1="500" y1="1318" x2="500" y2="1360" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 11: DISPERSIÓN MULTIVENDEDOR Y BILLETERA                             -->
  <!-- ========================================================================= -->
  <rect x="340" y="1360" width="320" height="74" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="500" y="1383" class="node-title">Dispersión Contable Multivendedor</text>
  <text x="500" y="1402" class="node-desc">Generación de merchant_suborders por comercio</text>
  <text x="500" y="1418" class="node-desc">Acreditación neta en libro mayor merchant_wallet_entries</text>

  <line x1="500" y1="1434" x2="500" y2="1480" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 12: JOBS ASÍNCRONOS EN SEGUNDO PLANO                                 -->
  <!-- ========================================================================= -->
  <text x="60" y="1510" class="phase-tag">Fase 5: Facturación &amp; Envíos</text>

  <rect x="180" y="1480" width="640" height="106" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" />
  <text x="500" y="1503" class="node-title" font-size="11.5px">Ejecución Asíncrona de Tareas en Segundo Plano (Queue Workers)</text>

  <!-- Sub-Job 1 -->
  <rect x="200" y="1520" width="190" height="50" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" />
  <text x="295" y="1540" class="node-title" font-size="10.5px">FactusService (DIAN)</text>
  <text x="295" y="1555" class="node-desc" font-size="9px">Emisión CUFE y XML oficial</text>

  <!-- Sub-Job 2 -->
  <rect x="405" y="1520" width="190" height="50" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" />
  <text x="500" y="1540" class="node-title" font-size="10.5px">EnviaService (Guía)</text>
  <text x="500" y="1555" class="node-desc" font-size="9px">Rótulo PDF de transporte</text>

  <!-- Sub-Job 3 -->
  <rect x="610" y="1520" width="190" height="50" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" />
  <text x="705" y="1540" class="node-title" font-size="10.5px">Resend Mailer</text>
  <text x="705" y="1555" class="node-desc" font-size="9px">Comprobante y trazabilidad</text>

  <line x1="500" y1="1586" x2="500" y2="1630" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 13: PREPARACIÓN Y DESPACHO FÍSICO                                    -->
  <!-- ========================================================================= -->
  <rect x="360" y="1630" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="1653" class="node-title">Despacho Físico de Mercancía</text>
  <text x="500" y="1673" class="node-desc">Comercio entrega paquete rotulado a transportadora</text>

  <line x1="500" y1="1694" x2="500" y2="1735" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 14: ENTREGA EFECTIVA                                                 -->
  <!-- ========================================================================= -->
  <rect x="360" y="1735" width="280" height="64" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="1758" class="node-title">Entrega Efectiva al Comprador</text>
  <text x="500" y="1778" class="node-desc">Confirmación de entrega mediante webhook Envia.com</text>

  <line x1="500" y1="1799" x2="500" y2="1840" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 15: DECISIÓN POSTVENTA                                               -->
  <!-- ========================================================================= -->
  <text x="60" y="1870" class="phase-tag">Fase 6: Postventa y Cierre</text>

  <polygon points="500,1840 650,1895 500,1950 350,1895" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="500" y="1888" class="decision-txt">¿Comprador</text>
  <text x="500" y="1906" class="decision-txt">Satisfecho?</text>

  <!-- Rama Inconforme / PQRS -->
  <line x1="650" y1="1895" x2="750" y2="1895" class="flow-dashed" marker-end="url(#arrow-dash)" />
  <text x="670" y="1885" class="badge-txt">NO</text>
  
  <rect x="750" y="1865" width="200" height="60" rx="6" fill="#F8FAFC" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="850" y="1888" class="node-title">Radicación PQRS (Ley 1480)</text>
  <text x="850" y="1906" class="node-desc">Trámite legal en 15 días hábiles</text>

  <line x1="850" y1="1925" x2="850" y2="1975" class="flow-dashed" marker-end="url(#arrow-dash)" />
  <rect x="750" y="1975" width="200" height="42" rx="21" fill="#E2E8F0" stroke="#000000" stroke-width="1.8" />
  <text x="850" y="1996" class="terminal-txt" font-size="11px">Fin: Incidencia Tramitada</text>

  <!-- Rama Satisfecho -->
  <line x1="500" y1="1950" x2="500" y2="2025" class="flow-solid" marker-end="url(#arrow-black)" />
  <text x="515" y="1990" class="badge-txt">SÍ</text>

  <!-- ========================================================================= -->
  <!-- NODO 16: VALORACIÓN NLP                                                   -->
  <!-- ========================================================================= -->
  <rect x="350" y="2025" width="300" height="66" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="500" y="2048" class="node-title">Calificación y Reseña de Producto</text>
  <text x="500" y="2068" class="node-desc">Análisis de tópicos NLP en ReviewTopicAnalysisService</text>

  <line x1="500" y1="2091" x2="500" y2="2135" class="flow-solid" marker-end="url(#arrow-black)" />

  <!-- ========================================================================= -->
  <!-- NODO 17: FIN EXITOSO                                                      -->
  <!-- ========================================================================= -->
  <rect x="390" y="2135" width="220" height="46" rx="23" ry="23" fill="#E2E8F0" stroke="#000000" stroke-width="2" />
  <text x="500" y="2158" class="terminal-txt">Fin: Venta Concluida y Liquidada</text>

</svg>