      <text x="490" y="854" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Tramitar y Resolver PQRS</text>
      <text x="490" y="870" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Resolución legal formal</text>
    </g>
  
  
    <g class="usecase-node">
