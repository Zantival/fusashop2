      <text x="490" y="790" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Geoanalítica Comunas</text>
    </g>
  
  
    <g class="usecase-node">
