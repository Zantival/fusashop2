      <text x="490" y="630" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Aprobación de habilitación</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="490" cy="700" rx="125" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="490" y="694" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Diagnosticar Ventas</text>
      <text x="490" y="710" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Sistema experto 12 causas</text>
    </g>
  
  
    <g class="usecase-node">
