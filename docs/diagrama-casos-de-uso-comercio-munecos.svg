  <!-- ASOCIACIONES COMERCIANTE (IZQUIERDA) -->
  <line x1="170" y1="280" x2="370" y2="130" class="assoc-line" />
  <line x1="170" y1="295" x2="370" y2="210" class="assoc-line" />
