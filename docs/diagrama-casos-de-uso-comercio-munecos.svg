      <text x="490" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Turismo y gastronomía</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="490" cy="530" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="490" y="524" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Responder Reseñas</text>
      <text x="490" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Atención directa postventa</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="490" cy="620" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
