<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #000000; letter-spacing: 1.5px; text-anchor: middle; }
    .actor-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
    .uc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .line { fill: none; stroke: #000000; stroke-width: 1.6; }
    .dash { fill: none; stroke: #000000; stroke-width: 1.4; stroke-dasharray: 6,4; }
    .tag { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
  </style>

  <!-- Fondo -->
  <rect width="1100" height="860" fill="#FFFFFF" />

  <!-- TÍTULO -->
  <text x="550" y="42" class="title">DIAGRAMA GENERAL DE CASOS DE USO</text>

  <!-- ACTOR IZQUIERDA: CLIENTE REGISTRADO -->
  <g transform="translate(130, 230)">
    <circle cx="0" cy="-36" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="-20" x2="0" y2="18" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="-7" x2="25" y2="-7" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="18" x2="-18" y2="50" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="18" x2="18" y2="50" stroke="#000000" stroke-width="2" />
    <text x="0" y="74" class="actor-label">Cliente registrado</text>
  </g>

  <!-- ACTOR DERECHA: CLIENTE (VISITANTE) -->
  <g transform="translate(970, 230)">
    <circle cx="0" cy="-36" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="-20" x2="0" y2="18" stroke="#000000" stroke-width="2" />
    <line x1="-25" y1="-7" x2="25" y2="-7" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="18" x2="-18" y2="50" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="18" x2="18" y2="50" stroke="#000000" stroke-width="2" />
    <text x="0" y="74" class="actor-label">Cliente</text>
  </g>

  <!-- CASOS DE USO SUPERIORES / CENTRALES -->
  <g>
    <ellipse cx="550" cy="95" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="95" class="uc-text">Navegar por la tienda</text>
  </g>
  <g>
    <ellipse cx="550" cy="175" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="175" class="uc-text">Ver detalles del producto</text>
  </g>
  <g>
    <ellipse cx="550" cy="255" rx="115" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="255" class="uc-text">Gestionar carrito</text>
  </g>
  <g>
    <ellipse cx="550" cy="345" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="345" class="uc-text">Registrarse</text>
  </g>
  <g>
    <ellipse cx="550" cy="450" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="450" class="uc-text">Iniciar sesión</text>
  </g>

  <!-- CASOS DE USO DERECHA (FLUJO COMPRA Y POST-VENTA) -->
  <g>
    <ellipse cx="800" cy="515" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="800" y="515" class="uc-text">Realizar compra</text>
  </g>
  <g>
    <ellipse cx="550" cy="575" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="550" y="575" class="uc-text">Ver pedido</text>
  </g>
  <g>
    <ellipse cx="805" cy="640" rx="115" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="805" y="640" class="uc-text">Contactar soporte / PQRS</text>
  </g>
  <g>
    <ellipse cx="805" cy="740" rx="110" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="805" y="740" class="uc-text">Calificar producto</text>
  </g>

  <!-- CASOS DE USO IZQUIERDA (GESTIÓN DE PERFIL) -->
  <g>
    <ellipse cx="295" cy="535" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="295" y="535" class="uc-text">Visualizar datos</text>
  </g>
  <g>
    <ellipse cx="160" cy="670" rx="95" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="160" y="670" class="uc-text">Actualizar datos</text>
  </g>
  <g>
    <ellipse cx="420" cy="670" rx="105" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
    <text x="420" y="670" class="uc-text">Cambiar contraseña</text>
  </g>

  <!-- ASOCIACIONES SÓLIDAS: CLIENTE REGISTRADO (IZQUIERDA) -->
  <line x1="165" y1="200" x2="430" y2="95" class="line" />
  <line x1="165" y1="215" x2="430" y2="175" class="line" />
  <line x1="165" y1="230" x2="435" y2="255" class="line" />
  <line x1="165" y1="265" x2="455" y2="435" class="line" />

  <!-- ASOCIACIONES SÓLIDAS: CLIENTE VISITANTE (DERECHA) -->
  <line x1="935" y1="200" x2="670" y2="95" class="line" />
  <line x1="935" y1="215" x2="670" y2="175" class="line" />
  <line x1="935" y1="230" x2="665" y2="255" class="line" />
  <line x1="935" y1="260" x2="655" y2="345" class="line" />

  <!-- RELACIONES <<include>> Y <<extend>> -->
  <!-- Registrarse -> Iniciar sesión -->
  <line x1="550" y1="371" x2="550" y2="424" class="dash" marker-end="url(#arrow)" />
  <text x="595" y="401" class="tag">&lt;&lt;include&gt;&gt;</text>

  <!-- Iniciar sesión -> Realizar compra -->
  <path d="M 645 468 L 715 498" class="dash" marker-end="url(#arrow)" />
  <text x="705" y="472" class="tag">&lt;&lt;include&gt;&gt;</text>

  <!-- Iniciar sesión -> Ver pedido -->
  <line x1="550" y1="476" x2="550" y2="549" class="dash" marker-end="url(#arrow)" />
  <text x="502" y="515" class="tag">&lt;&lt;extend&gt;&gt;</text>

  <!-- Ver pedido -> Contactar soporte / PQRS -->
  <path d="M 645 592 L 715 624" class="dash" marker-end="url(#arrow)" />
  <text x="700" y="598" class="tag">&lt;&lt;extend&gt;&gt;</text>

  <!-- Ver pedido -> Calificar producto -->
  <path d="M 625 596 L 725 718" class="dash" marker-end="url(#arrow)" />
  <text x="700" y="675" class="tag">&lt;&lt;extend&gt;&gt;</text>

  <!-- Iniciar sesión -> Visualizar datos -->
  <path d="M 455 466 L 375 515" class="dash" marker-end="url(#arrow)" />
  <text x="390" y="478" class="tag">&lt;&lt;extend&gt;&gt;</text>

  <!-- Visualizar datos -> Actualizar datos -->
  <path d="M 255 558 L 188 644" class="dash" marker-end="url(#arrow)" />
  <text x="195" y="595" class="tag">&lt;&lt;extend&gt;&gt;</text>

  <!-- Visualizar datos -> Cambiar contraseña -->
  <path d="M 335 558 L 398 644" class="dash" marker-end="url(#arrow)" />
  <text x="395" y="595" class="tag">&lt;&lt;extend&gt;&gt;</text>
</svg>
