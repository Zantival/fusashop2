      <text x="420" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Agregar / Modificar ítems</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="410" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C04: Realizar Compra</text>
      <text x="420" y="419" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Checkout de Productos Físicos</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="525" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C07: Consultar Historial</text>
      <text x="420" y="534" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Pedidos, Recibos y Facturas</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="635" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="628" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C09: Reservar Servicios</text>
      <text x="420" y="644" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Agendamiento Local y Citas</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="725" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="718" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C11: Mensajería / Chat</text>
      <text x="420" y="734" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Comunicación con Tienda</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="810" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="803" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C12: Radicar PQRS</text>
      <text x="420" y="819" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Peticiones, Quejas y Reclamos</text>
    </g>
  

  <!-- Casos de Uso Subordinados (Columna Derecha) -->
  
    <g class="usecase-node">
      <ellipse cx="780" cy="145" rx="120" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="780" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C01.1: Autenticar Cuenta</text>
      <text x="780" y="154" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Login Email o Google OAuth</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="780" cy="365" rx="120" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="780" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C05: Cotizar Envío</text>
      <text x="780" y="374" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">API Envia.com / Transportadora</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="780" cy="445" rx="120" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="780" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C06: Procesar Pago</text>
      <text x="780" y="454" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Pasarela Wompi / PSE</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="780" cy="515" rx="120" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="780" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C08: Rastrear Envío</text>
      <text x="780" y="524" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Guía y Trazabilidad en Ruta</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="780" cy="590" rx="120" ry="25" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="780" y="583" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C10: Calificar Producto</text>
      <text x="780" y="599" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Reseña de Compra Recibida</text>
    </g>
  

  <!-- Asociaciones Directas Actor -> Casos de Uso -->
  <line x1="145" y1="390" x2="300" y2="145" class="assoc-line" />
  <line x1="145" y1="405" x2="300" y2="230" class="assoc-line" />
  <line x1="145" y1="420" x2="300" y2="315" class="assoc-line" />
  <line x1="145" y1="435" x2="300" y2="410" class="assoc-line" />
  <line x1="145" y1="455" x2="300" y2="525" class="assoc-line" />
  <line x1="145" y1="475" x2="300" y2="635" class="assoc-line" />
  <line x1="145" y1="495" x2="300" y2="725" class="assoc-line" />
  <line x1="145" y1="510" x2="300" y2="810" class="assoc-line" />

  <!-- Dependencias <<include>> -->
  <!-- CU-C01 -> CU-C01.1 -->
  <line x1="540" y1="145" x2="660" y2="145" class="dep-line" marker-end="url(#arrow-open)" />
  
    <g transform="translate(600, 140)">
      <rect x="-36.5" y="-8" width="73" height="16" fill="#FFFFFF" stroke="none" />
      <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">«include»</text>
    </g>
  

  <!-- CU-C04 -> CU-C05 -->
  <path d="M 540 400 L 660 375" class="dep-line" marker-end="url(#arrow-open)" />
  
    <g transform="translate(598, 382)">
      <rect x="-36.5" y="-8" width="73" height="16" fill="#FFFFFF" stroke="none" />
      <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">«include»</text>
    </g>
  

  <!-- CU-C04 -> CU-C06 -->
  <path d="M 540 420 L 660 440" class="dep-line" marker-end="url(#arrow-open)" />
  
    <g transform="translate(598, 437)">
      <rect x="-36.5" y="-8" width="73" height="16" fill="#FFFFFF" stroke="none" />
      <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">«include»</text>
    </g>
  

  <!-- Dependencias <<extend>> -->
  <!-- CU-C08 -> CU-C07 -->
  <path d="M 660 520 L 540 525" class="dep-line" marker-end="url(#arrow-open)" />
  
    <g transform="translate(600, 517)">
      <rect x="-33" y="-8" width="66" height="16" fill="#FFFFFF" stroke="none" />
      <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">«extend»</text>
    </g>
  

  <!-- CU-C10 -> CU-C07 -->
  <path d="M 660 580 L 538 540" class="dep-line" marker-end="url(#arrow-open)" />
  
    <g transform="translate(600, 568)">
      <rect x="-33" y="-8" width="66" height="16" fill="#FFFFFF" stroke="none" />
      <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#000000" text-anchor="middle">«extend»</text>
    </g>
  

  <!-- Cuadro de Convenciones Inferior -->
  <rect x="230" y="905" width="780" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
  <text x="245" y="925" class="legend-title">CONVENCIONES UML 2.5 (CASO DE USO):</text>
  <text x="245" y="942" class="legend-text">• Muñequito: Actor Consumidor (Iniciador). • Rectángulo: Límite del sistema. • Elipses: Casos de uso funcionales.</text>
  <text x="245" y="954" class="legend-text">• Línea continua: Asociación directa. • Línea discontinua con flecha: Dependencias «include» (obligatoria) y «extend» (condicional).</text>
</svg>