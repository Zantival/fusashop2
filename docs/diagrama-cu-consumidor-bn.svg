<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 980" width="1050" height="980">
  
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
  </defs>
  <style>
    .title-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #000000; letter-spacing: 0.8px; text-anchor: middle; }
    .title-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #333333; text-anchor: middle; }
    .boundary-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; }
    .assoc-line { fill: none; stroke: #000000; stroke-width: 1.6; }
    .dep-line { fill: none; stroke: #000000; stroke-width: 1.4; stroke-dasharray: 5,4; }
    .legend-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #000000; }
    .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #000000; }
  </style>

  <rect width="1050" height="980" fill="#FFFFFF" />

  <!-- Encabezado -->
  <text x="525" y="38" class="title-main">DIAGRAMA DE CASOS DE USO — ROL CONSUMIDOR</text>
  <text x="525" y="60" class="title-sub">Plataforma FusaShop · Especificación UML 2.5 en Blanco y Negro (Con Muñequito)</text>

  <!-- Límite del Sistema -->
  <rect x="230" y="80" width="780" height="810" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  <text x="245" y="104" class="boundary-title">Sistema FusaShop — Módulo Consumidor / Comprador</text>

  <!-- Muñequito: Consumidor -->
  
    <g class="actor-group" transform="translate(115, 430)">
      <!-- Cabeza -->
      <circle cx="0" cy="-44" r="19" fill="#FFFFFF" stroke="#000000" stroke-width="2.4" />
      <!-- Tronco -->
      <line x1="0" y1="-25" x2="0" y2="24" stroke="#000000" stroke-width="2.4" />
      <!-- Brazos -->
      <line x1="-30" y1="-6" x2="30" y2="-6" stroke="#000000" stroke-width="2.4" />
      <!-- Piernas -->
      <line x1="0" y1="24" x2="-24" y2="65" stroke="#000000" stroke-width="2.4" />
      <line x1="0" y1="24" x2="24" y2="65" stroke="#000000" stroke-width="2.4" />
      <!-- Etiqueta del Actor -->
      <text x="0" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#000000" text-anchor="middle">Consumidor</text>
      <text x="0" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" text-anchor="middle">(Cliente / Comprador)</text>
    </g>
  

  <!-- Casos de Uso Principales (Columna Izquierda) -->
  
    <g class="usecase-node">
      <ellipse cx="420" cy="145" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C01: Gestionar Cuenta</text>
      <text x="420" y="154" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Registro y Verificación 6 Dígitos</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="230" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
      <text x="420" y="223" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">CU-C02: Explorar Catálogo</text>
      <text x="420" y="239" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" fill="#222222" text-anchor="middle" dominant-baseline="middle">Búsqueda Asistida y Filtros</text>
    </g>
  
  
    <g class="usecase-node">
      <ellipse cx="420" cy="315" rx="120" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
